<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="HRT.org Fundamental 5 test kit">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f9fbfc"/>
      <stop offset="1" stop-color="#f1f5f8"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d2b4b"/>
      <stop offset="1" stop-color="#1b3b5c"/>
    </linearGradient>
  </defs>
  <!-- backdrop -->
  <rect width="1024" height="1024" fill="url(#g1)"/>
  <!-- subtle outer glow -->
  <ellipse cx="512" cy="900" rx="440" ry="46" fill="#000" opacity=".06"/>
  <!-- kit body -->
  <rect x="48" y="60" width="928" height="904" rx="36" fill="#ffffff" stroke="#e3eaf0" stroke-width="2"/>
  <!-- top navy ribbon -->
  <path d="M48 60 h928 a36 36 0 0 1 36 36 v12 H12 V96 a36 36 0 0 1 36 -36z" fill="#0d2b4b"/>
  <!-- HRT.org mark top-left -->
  <text x="80" y="170" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="500" fill="#0d2b4b" letter-spacing=".5">HRT</text>
  <text x="80" y="196" font-family="Geist, system-ui, sans-serif" font-size="10" letter-spacing="4" fill="#8094a7">— hrt.org —</text>
  <!-- small cross glyph top-right -->
  <g transform="translate(900 148)" opacity=".85">
    <circle r="20" fill="#e6f1f3"/>
    <path d="M-9 0 h18 M0 -9 v18" stroke="#267f91" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- accent lines -->
  <rect x="78" y="260" width="420" height="7" rx="3.5" fill="#267f91"/><rect x="78" y="284" width="150" height="7" rx="3.5" fill="#c89a46"/><rect x="78" y="308" width="340" height="7" rx="3.5" fill="#914674"/><rect x="78" y="332" width="240" height="7" rx="3.5" fill="#0d2b4b"/><rect x="78" y="356" width="170" height="7" rx="3.5" fill="#c89a46"/><rect x="78" y="380" width="400" height="7" rx="3.5" fill="#267f91"/><rect x="78" y="404" width="260" height="7" rx="3.5" fill="#914674"/>
  <!-- title block -->
  <text x="78" y="520" font-family="Newsreader, Georgia, serif" font-size="78" font-weight="500" fill="#914674" letter-spacing="-1.8">Fundamental 5</text>
  <text x="80" y="560" font-family="Geist, system-ui, sans-serif" font-size="18" letter-spacing="3" fill="#0d2b4b">HORMONE PANEL</text>
  <text x="80" y="594" font-family="Geist, system-ui, sans-serif" font-size="15" fill="#4f647b">Easy at-home saliva collection</text>
  <!-- biomarker panel -->
  <rect x="78" y="620" width="868" height="290" rx="18" fill="#e6f1f3"/>
  <rect x="78" y="620" width="140" height="290" rx="18" fill="#267f91"/>
  <rect x="200" y="620" width="24" height="290" fill="#267f91"/>
  <text x="110" y="660" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#ffffff" letter-spacing="2.5">SAMPLE</text>
  <text x="110" y="700" font-family="Newsreader, Georgia, serif" font-size="26" font-weight="500" fill="#ffffff">Saliva</text>
  <text x="258" y="652" font-family="Geist, system-ui, sans-serif" font-size="20" fill="#153650">DHEA-S</text><text x="700" y="652" font-family="Geist, system-ui, sans-serif" font-size="18" fill="#4f647b" letter-spacing="1.5">DS</text><text x="258" y="696" font-family="Geist, system-ui, sans-serif" font-size="20" fill="#153650">Estradiol</text><text x="700" y="696" font-family="Geist, system-ui, sans-serif" font-size="18" fill="#4f647b" letter-spacing="1.5">E2</text><text x="258" y="740" font-family="Geist, system-ui, sans-serif" font-size="20" fill="#153650">Testosterone</text><text x="700" y="740" font-family="Geist, system-ui, sans-serif" font-size="18" fill="#4f647b" letter-spacing="1.5">T</text><text x="258" y="784" font-family="Geist, system-ui, sans-serif" font-size="20" fill="#153650">Progesterone</text><text x="700" y="784" font-family="Geist, system-ui, sans-serif" font-size="18" fill="#4f647b" letter-spacing="1.5">Pg</text><text x="258" y="828" font-family="Geist, system-ui, sans-serif" font-size="20" fill="#153650">Cortisol</text><text x="700" y="828" font-family="Geist, system-ui, sans-serif" font-size="18" fill="#4f647b" letter-spacing="1.5">C</text>
  <!-- footer bar -->
  <rect x="48" y="904" width="928" height="60" rx="0" fill="url(#footer)"/>
  <path d="M48 904 h928 v24 H48 Z" fill="transparent"/>
  <path d="M940 964 a36 36 0 0 0 36 -36 V 904 H940 Z" fill="url(#footer)"/>
  <path d="M48 904 h0 v24 a0 0 0 0 0 0 24 Z" fill="transparent"/>
  <text x="80" y="942" font-family="Geist, system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#8ac0cf">PROCESSED BY</text>
  <text x="210" y="942" font-family="Newsreader, Georgia, serif" font-size="18" fill="#ffffff">HRT.org Labs</text>
  <text x="944" y="942" font-family="Newsreader, Georgia, serif" font-size="22" font-weight="500" fill="#ffffff" text-anchor="end">HRT.org</text>
</svg>